services:
  postgres:
    image: postgres:17-alpine
    container_name: buggytrip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buggytrip}
      POSTGRES_USER: ${POSTGRES_USER:-buggytrip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buggytrip}
    ports: [ "5432:5432" ]
    volumes: [ buggytrip-postgres-data:/var/lib/postgresql/data ]
    healthcheck: { test: [ "CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ],interval: 5s,timeout: 5s,retries: 10 }
  app:
    build: { context: ., dockerfile: Dockerfile }
    container_name: buggytrip-app
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-buggytrip}
      DB_USERNAME: ${POSTGRES_USER:-buggytrip}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-buggytrip}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-secret-at-least-32-bytes-123456}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      SERVER_PORT: 8080
    ports: [ "8080:8080" ]
    healthcheck: { test: [ "CMD-SHELL","wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP" ],interval: 10s,timeout: 5s,start_period: 45s,retries: 10 }
volumes:
  buggytrip-postgres-data:
