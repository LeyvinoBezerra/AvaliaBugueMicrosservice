name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "rollback/**"
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: validate-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate Gitflow branch policy
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(fromJSON('["develop","main"]'), github.ref_name))
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          validate_slug() {
            local branch="$1"
            local prefix="$2"
            [[ "$branch" =~ ^${prefix}/[a-z0-9]+(-[a-z0-9]+)*$ ]]
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            branch="$HEAD_REF"
            case "$branch" in
              feature/*)
                [[ "$branch" =~ ^feature/[a-z0-9]+(-[a-z0-9]+)+$ ]] || {
                  echo "Use feature/tarefa-nomeada (lowercase kebab-case)." >&2
                  exit 1
                }
                ;;
              bugfix/*)
                validate_slug "$branch" "bugfix" || { echo "Invalid bugfix branch name." >&2; exit 1; }
                ;;
              hotfix/*)
                validate_slug "$branch" "hotfix" || { echo "Invalid hotfix branch name." >&2; exit 1; }
                ;;
              rollback/*)
                validate_slug "$branch" "rollback" || { echo "Invalid rollback branch name." >&2; exit 1; }
                ;;
              *)
                echo "Unsupported branch: $branch" >&2
                exit 1
                ;;
            esac
          else
            case "$HEAD_REF:$BASE_REF" in
              feature/*:develop)
                [[ "$HEAD_REF" =~ ^feature/[a-z0-9]+(-[a-z0-9]+)+$ ]] || {
                  echo "Use feature/tarefa-nomeada (lowercase kebab-case)." >&2
                  exit 1
                }
                ;;
              develop:main)
                ;;
              bugfix/*:main|hotfix/*:main|rollback/*:main)
                prefix="${HEAD_REF%%/*}"
                validate_slug "$HEAD_REF" "$prefix" || {
                  echo "Use a lowercase kebab-case branch name." >&2
                  exit 1
                }
                ;;
              main:develop)
                ;;
              *)
                echo "Disallowed PR flow: $HEAD_REF -> $BASE_REF" >&2
                echo "Allowed: feature/* -> develop; develop -> main; bugfix|hotfix|rollback/* -> main; main -> develop (sync)." >&2
                exit 1
                ;;
            esac
          fi

      - name: Make Maven Wrapper executable
        shell: bash
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw -B verify

  deploy:
    name: deploy-ecs
    needs: validate-and-test
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: ecs-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current ECS task definition
        shell: bash
        run: |
          set -euo pipefail
          : "${ECS_TASK_DEFINITION:?Set ECS_TASK_DEFINITION in the GitHub environment}"
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json \
            | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > task-definition.json

      - name: Render task definition with the new image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true
