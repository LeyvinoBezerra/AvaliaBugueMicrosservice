name: Gitflow pull requests

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "rollback/**"
      - develop
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    name: create-pull-request
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.head.ref, 'bugfix/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/') ||
        startsWith(github.event.pull_request.head.ref, 'rollback/')))
    runs-on: ubuntu-latest
    steps:
      - name: Open the next Gitflow pull request
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.payload;
            let head;
            let base;
            let title;
            let body;

            if (context.eventName === "push") {
              head = context.ref.replace("refs/heads/", "");
              if (head === "develop") {
                base = "main";
                title = "release: promote develop to main";
                body = "Automated Gitflow promotion from `develop` to `main`.";
              } else if (head.startsWith("feature/")) {
                base = "develop";
                title = `feat: ${head.slice("feature/".length)}`;
                body = `Automated feature pull request for \`${head}\` into \`develop\`.`;
              } else if (
                head.startsWith("bugfix/") ||
                head.startsWith("hotfix/") ||
                head.startsWith("rollback/")
              ) {
                base = "main";
                title = `${head.split("/")[0]}: ${head.split("/").slice(1).join("/")}`;
                body = `Automated urgent fix/rollback pull request for \`${head}\` into \`main\`.`;
              } else {
                core.setFailed(`Unsupported source branch: ${head}`);
                return;
              }
            } else {
              head = "main";
              base = "develop";
              title = "chore: sync main back to develop";
              body = `Automated synchronization after merging \`${event.pull_request.head.ref}\` into \`main\`.`;
            }

            const { owner, repo } = context.repo;
            const comparison = await github.request(
              "GET /repos/{owner}/{repo}/compare/{base}...{head}",
              { owner, repo, base, head }
            );
            if (comparison.data.ahead_by === 0) {
              core.info(`No commits to promote from ${head} to ${base}.`);
              return;
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${head}`,
              base
            });

            if (existing.data.length > 0) {
              core.info(`Pull request #${existing.data[0].number} already exists.`);
              return;
            }

            const pullRequest = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body
            });
            core.info(`Opened pull request #${pullRequest.data.number}: ${head} -> ${base}`);
